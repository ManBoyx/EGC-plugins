# English messages. Color codes: &a, &l… and &#rrggbb (hex colors, from 1.16).
# {tokens} are replaced by the plugin. Keep the quotes. An empty text disables the message.
prefix: "&8[&bEGC&8] &7"
general:
  no-permission: "&cYou don't have permission to do that."
  player-only: "&cThis command must be run by a player."
  player-not-found: "&cPlayer not found: &f{name}"
  usage: "&cUsage: &f{usage}"
  internal-error: "&cAn internal error occurred. Please tell an administrator."
  invalid-number: "&cInvalid number: &f{value}"
  module-disabled: "&cThis feature is disabled on this server."
core:
  reloaded: "&aConfiguration and messages reloaded."
  help-header: "&6Available commands:"
  help-line: "&e{usage} &7- {description}"
  info-line: "&e{label} &7: &f{value}"
  broadcast: "&6[Announcement] &f{message}"
  sent: "&aSent to &f{count}&a player(s)."
teleport:
  warmup: "&7Teleporting in &f{seconds}&7 seconds… don't move!"
  cancelled-moved: "&cTeleport cancelled: you moved."
  cooldown: "&cWait &f{time}&c before teleporting again."
  pending: "&cA teleport is already in progress."
  failed: "&cTeleport failed."
  world-missing: "&cThe world &f{world}&c no longer exists."
spawn:
  set: "&aSpawn set here."
  not-set: "&cThe spawn is not set."
  teleported: "&aWelcome to spawn."
  sent: "&a{player} was sent to spawn."
home:
  set: "&aHome &f{name}&a saved."
  limit: "&cYou reached your limit of &f{limit}&c home(s)."
  not-found: "&cHome not found: &f{name}"
  deleted: "&aHome &f{name}&a deleted."
  list: "&7Your homes (&f{count}&7/&f{limit}&7): &f{homes}"
  none: "&7You have no homes. Use &f/sethome&7."
  invalid-name: "&cInvalid name: letters, digits, _ and - (24 max)."
  teleported: "&aWelcome to home &f{name}&a."
warp:
  set: "&aWarp &f{name}&a created."
  deleted: "&aWarp &f{name}&a deleted."
  not-found: "&cWarp not found: &f{name}"
  list: "&7Warps: &f{warps}"
  none: "&7No warps available."
  teleported: "&aTeleported to &f{name}&a."
  invalid-name: "&cInvalid name: letters, digits, _ and - (24 max)."
  no-permission: "&cYou can't use the warp &f{name}&c."
tpa:
  sent: "&aRequest sent to &f{player}&a."
  received: "&f{player}&e wants to teleport to you. &a/tpaccept&e or &c/tpdeny"
  received-here: "&f{player}&e asks you to teleport to their position. &a/tpaccept&e or &c/tpdeny"
  none: "&cNo pending request."
  accepted: "&aYou accepted &f{player}&a's request."
  accepted-notice: "&f{player}&a accepted your request."
  denied: "&7Request from &f{player}&7 denied."
  denied-notice: "&f{player}&c denied your request."
  cancelled: "&7{count} request(s) cancelled."
  self: "&cYou can't target yourself."
  requester-offline: "&cThat player has disconnected."
back:
  none: "&cNowhere to go back to."
  teleported: "&aBack to your previous location."
kit:
  list: "&7Available kits: &f{kits}"
  none: "&7No kits available."
  not-found: "&cKit not found: &f{name}"
  no-permission: "&cYou can't use the kit &f{name}&c."
  cooldown: "&cKit &f{name}&c available in &f{time}&c."
  received: "&aKit &f{name}&a received!"
  given: "&aKit &f{name}&a given to &f{player}&a."
  dropped: "&7Your inventory is full: the rest dropped at your feet."
eco:
  balance: "&7Balance: &a{amount}"
  balance-other: "&7Balance of &f{player}&7: &a{amount}"
  paid: "&aYou sent &f{amount}&a to &f{player}&a."
  received: "&f{player}&a sent you &f{amount}&a."
  not-enough: "&cInsufficient funds."
  invalid-amount: "&cInvalid amount."
  too-rich: "&c{player} can't receive that much."
  self: "&cYou can't pay yourself."
  admin-done: "&aNew balance of &f{player}&a: &f{amount}"
  top-header: "&6Richest players:"
  top-line: "&e{rank}. &f{player} &7- &a{amount}"
  top-empty: "&7No accounts yet."
chat:
  spam: "&cSlow down! You're typing too fast."
  repeat: "&cPlease don't repeat your messages."
  caps: "&cPlease don't write in capitals."
  word: "&cThis message contains a forbidden word."
  link: "&cLinks are not allowed here."
  cleared: "&7Chat was cleared by &f{player}&7."
util:
  healed: "&aYou have been healed."
  fed: "&aYour hunger is gone."
  done-for: "&aDone for &f{player}&a."
  fly-on: "&aFlight enabled."
  fly-off: "&7Flight disabled."
  gamemode: "&aGame mode: &f{mode}"
  gamemode-invalid: "&cUnknown mode (survival, creative, adventure, spectator)."
  speed: "&aSpeed: &f{value}"
  speed-invalid: "&cSpeed goes from 1 to 10."
  ping: "&7Your ping: &f{ping} ms"
  ping-other: "&7Ping of &f{player}&7: &f{ping} ms"
  ping-unknown: "&cPing is not available on this version."
join:
  message: "&8[&a+&8] &7{player}"
  first: "&d{player}&e joined the server for the first time! Welcome!"
  quit: "&8[&c-&8] &7{player}"
  title: "&6Welcome"
  subtitle: "&7{player}"
info:
  unknown: "&cUnknown topic: &f{topic}"
  topics: "&7Topics: &f{topics}"
